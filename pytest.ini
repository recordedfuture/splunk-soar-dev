[pytest]
# Tests live in this repo (the parent), the app code lives in the submodule.
testpaths =
    tests
python_files = test_*.py
python_classes = *Test
# splunk-soar is on the path so tests can import recordedfuture_connector etc.
pythonpath =
    splunk-soar
# pkg_build is a build artefact containing a copy of the app; never collect from it.
norecursedirs =
    pkg_build
    venv*
    integration_tests
